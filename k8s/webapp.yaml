apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      initContainers:
      - name: wait-for-sql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z sql-service 3306; do echo waiting for mysql; sleep 2; done']
      containers:
      - name: webapp
        image: manhumann/2-tire-web-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: DBUSER
          valueFrom:
            secretKeyRef:
              name: secret-sql
              key: DBUSER
        - name: DBPWD
          valueFrom:
            secretKeyRef:
              name: secret-sql
              key: DBPWD
        - name: DBHOST
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: DBHOST
        - name: DBPORT
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: DBPORT
        - name: DATABASE
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: DATABASE
        - name: APP_COLOR
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: COLOR_FROM_ENV



---

apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30100