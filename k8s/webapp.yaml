apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: manhumann/2-tire-web-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: USER_NAME
          valueFrom:
            secretKeyRef:
              name: secret-sql
              key: DBUSER
        - name: USER_PWD
          valueFrom:
            secretKeyRef:
              name: secret-sql
              key: DBPWD
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: DBHOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: DBPORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: sql-config-map
              key: DATABASE



---

apiVersion: v1
kind: Service
metadata:
  name: webapp-service
spec:
  type: NodePort
  selector:
    app: webapp
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30100