apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: two-tier-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ManHumann/2-tier-web-app.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false